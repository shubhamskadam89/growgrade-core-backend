spring:
  datasource:
    url: jdbc:mysql://localhost:3306/core_backend_growgrade
    username: root
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

logging:
  level:
    root: INFO
    com.auth_app.backend.auth_app: DEBUG
